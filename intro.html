<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自我介绍</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
      color: #fff;
      font-weight: 600;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .title {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #667eea;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-tag {
      background: #f0f0ff;
      color: #667eea;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      color: #444;
      font-size: 14px;
    }

    .contact-item .label {
      color: #999;
      min-width: 52px;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 24px 0;
    }

    .bio {
      color: #666;
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">T</div>
    <h1>Test User</h1>
    <p class="title">全栈开发者</p>

    <div class="bio section">
      <p>热爱编程，专注于构建高质量的 Web 应用。善于将复杂问题简单化，追求代码的优雅与可维护性。</p>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-title">技能</div>
      <div class="skills">
        <span class="skill-tag">Python</span>
        <span class="skill-tag">TypeScript</span>
        <span class="skill-tag">React</span>
        <span class="skill-tag">Node.js</span>
        <span class="skill-tag">Next.js</span>
        <span class="skill-tag">PostgreSQL</span>
        <span class="skill-tag">Fastify</span>
        <span class="skill-tag">Docker</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-title">联系方式</div>
      <div class="contact-item">
        <span class="label">邮箱</span>
        <span>testuser@example.com</span>
      </div>
      <div class="contact-item">
        <span class="label">GitHub</span>
        <span>github.com/testuser</span>
      </div>
      <div class="contact-item">
        <span class="label">微信</span>
        <span>testuser_wechat</span>
      </div>
    </div>
  </div>
</body>
</html>
