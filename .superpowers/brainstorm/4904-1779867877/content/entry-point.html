
<h2>入口位置 — Agent 管理放在哪里？</h2>
<p class="subtitle">用户如何进入 Agent 管理界面？</p>

<div class="options">
  <div class="option" data-choice="sidebar" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>侧边栏入口</h3>
      <p>在侧边栏底部或用户信息区附近加一个 "Agent 管理" 按钮，点击切换到管理页面</p>
    </div>
  </div>
  <div class="option" data-choice="standalone" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>独立页面</h3>
      <p><code>/agents</code> 路由，类似 <code>/chat</code> 的独立页面，可通过导航访问</p>
    </div>
  </div>
  <div class="option" data-choice="dialog" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>弹窗 + 侧边栏</h3>
      <p>侧边栏的"新建聊天"弹窗里加 "管理 Agent" 按钮，打开一个全屏弹窗/抽屉进行管理</p>
    </div>
  </div>
</div>
