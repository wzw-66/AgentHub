
<h2>Agent 管理模块 — 范围确定</h2>
<p class="subtitle">你希望 Agent 管理模块包含哪些功能？</p>

<div class="options">
  <div class="option" data-choice="create-only" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>仅创建</h3>
      <p>一个创建 Agent 的表单页面/弹窗，填写名称、提供商、模型等信息后提交</p>
    </div>
  </div>
  <div class="option" data-choice="full-crud" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>完整管理</h3>
      <p>列表查看所有 Agents + 创建 + 编辑 + 删除，类似一个管理后台</p>
    </div>
  </div>
  <div class="option" data-choice="crud-with-detail" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>管理 + 详情查看</h3>
      <p>列表 + 创建 + 编辑 + 删除，并且可以查看 Agent 的详细信息和运行状态</p>
    </div>
  </div>
</div>
