<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人介绍</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      padding: 40px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: #fff;
    }

    h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 8px;
    }

    .title {
      font-size: 16px;
      color: #667eea;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .bio {
      font-size: 15px;
      color: #666;
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .skill-tag {
      background: #f0f2ff;
      color: #667eea;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .contact {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .contact a {
      text-decoration: none;
      color: #999;
      font-size: 14px;
      transition: color 0.2s;
    }

    .contact a:hover {
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🧑</div>
    <h1>张三</h1>
    <p class="title">前端开发工程师</p>
    <p class="bio">
      你好！我是一名热爱技术的前端开发者，专注于 Web 开发与用户体验。
      喜欢将设计转化为流畅、美观的交互界面，持续学习新技术，追求更好的代码质量。
    </p>
    <div class="skills">
      <span class="skill-tag">HTML / CSS</span>
      <span class="skill-tag">JavaScript</span>
      <span class="skill-tag">React</span>
      <span class="skill-tag">TypeScript</span>
      <span class="skill-tag">Node.js</span>
      <span class="skill-tag">Tailwind</span>
    </div>
    <div class="contact">
      <a href="#">📧 Email</a>
      <a href="#">💬 GitHub</a>
      <a href="#">📱 微信</a>
    </div>
  </div>
</body>
</html>
