<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人简介</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      padding: 24px;
    }

    .card {
      max-width: 460px;
      width: 100%;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    /* header area */
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 48px 40px 40px;
      text-align: center;
      color: #fff;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 3px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 40px;
      user-select: none;
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .role {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.65);
      font-weight: 400;
    }

    /* body area */
    .body {
      padding: 32px 40px 40px;
    }

    .section {
      margin-bottom: 24px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .bio {
      font-size: 15px;
      line-height: 1.9;
      color: #475569;
    }

    /* skills */
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      background: #f1f5f9;
      color: #334155;
    }

    /* info list */
    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #64748b;
    }

    .info-item .icon {
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    /* contact */
    .contact {
      display: flex;
      gap: 12px;
    }

    .contact a {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }

    .contact .email {
      background: #0f172a;
      color: #fff;
    }

    .contact .email:hover {
      background: #1e293b;
    }

    .contact .github {
      background: #f1f5f9;
      color: #0f172a;
    }

    .contact .github:hover {
      background: #e2e8f0;
    }

    /* responsive */
    @media (max-width: 480px) {
      .header { padding: 36px 24px 28px; }
      .body { padding: 24px; }
      .contact { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="avatar">👤</div>
      <h1 class="name">你的名字</h1>
      <p class="role">全栈开发工程师</p>
    </div>

    <div class="body">
      <div class="section">
        <div class="section-title">关于我</div>
        <p class="bio">
          你好！我是一名热爱技术的全栈开发者。喜欢将想法转化为简洁、高效的产品，
          持续学习新技术，追求代码质量与用户体验的平衡。
        </p>
      </div>

      <div class="section">
        <div class="section-title">技能</div>
        <div class="skills">
          <span class="skill">JavaScript</span>
          <span class="skill">TypeScript</span>
          <span class="skill">React</span>
          <span class="skill">Node.js</span>
          <span class="skill">Python</span>
          <span class="skill">PostgreSQL</span>
          <span class="skill">Docker</span>
          <span class="skill">Git</span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">基本信息</div>
        <div class="info-list">
          <div class="info-item">
            <span class="icon">📍</span><span>中国 · 北京</span>
          </div>
          <div class="info-item">
            <span class="icon">💼</span><span>3 年全栈开发经验</span>
          </div>
          <div class="info-item">
            <span class="icon">🎓</span><span>计算机科学与技术 · 本科</span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">联系方式</div>
        <div class="contact">
          <a href="mailto:your@email.com" class="email">📧 邮箱</a>
          <a href="https://github.com" target="_blank" class="github">💻 GitHub</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
