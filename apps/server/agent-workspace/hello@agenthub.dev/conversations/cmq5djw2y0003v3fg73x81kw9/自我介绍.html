<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人介绍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            max-width: 600px;
            width: 100%;
            padding: 48px 40px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 48px;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .title {
            text-align: center;
            color: #667eea;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .divider {
            height: 1px;
            background: #e8e8e8;
            margin: 24px 0;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .section p {
            font-size: 15px;
            line-height: 1.8;
            color: #444;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .tag {
            background: #f0f2ff;
            color: #667eea;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .contact {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 16px;
        }

        .contact a {
            text-decoration: none;
            color: #666;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 8px;
            background: #f5f5f5;
            transition: all 0.2s ease;
        }

        .contact a:hover {
            background: #667eea;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 头像 -->
        <div class="avatar">👤</div>

        <!-- 姓名 & 头衔 -->
        <h1>张三</h1>
        <p class="title">全栈开发工程师</p>

        <div class="divider"></div>

        <!-- 关于我 -->
        <div class="section">
            <div class="section-title">关于我</div>
            <p>
                你好！我是一名热爱技术的全栈开发者，拥有 5 年 Web 开发经验。
                专注于构建高性能、用户友好的应用程序。喜欢探索新技术，
                并乐于将复杂的想法转化为简洁优雅的代码。
            </p>
        </div>

        <!-- 技能标签 -->
        <div class="section">
            <div class="section-title">技能</div>
            <div class="tags">
                <span class="tag">JavaScript / TypeScript</span>
                <span class="tag">React / Vue</span>
                <span class="tag">Node.js</span>
                <span class="tag">Python</span>
                <span class="tag">PostgreSQL</span>
                <span class="tag">Docker</span>
                <span class="tag">Git</span>
                <span class="tag">RESTful API</span>
            </div>
        </div>

        <!-- 兴趣爱好 -->
        <div class="section">
            <div class="section-title">兴趣爱好</div>
            <p>
                📚 阅读 &nbsp;|&nbsp; ✈️ 旅行 &nbsp;|&nbsp; 🎮 游戏 &nbsp;|&nbsp; 🏃 跑步
            </p>
        </div>

        <div class="divider"></div>

        <!-- 联系方式 -->
        <div class="contact">
            <a href="mailto:zhangsan@example.com">📧 邮箱</a>
            <a href="https://github.com" target="_blank">💻 GitHub</a>
            <a href="#">💬 微信</a>
        </div>
    </div>
</body>
</html>
