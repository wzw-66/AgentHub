<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人介绍</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 48px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
      color: white;
      font-weight: bold;
    }

    h1 {
      font-size: 28px;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .title {
      color: #667eea;
      font-size: 16px;
      margin-bottom: 24px;
    }

    .section {
      text-align: left;
      margin-bottom: 24px;
    }

    .section h2 {
      font-size: 16px;
      color: #1a1a2e;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #f0f0f0;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-tag {
      background: #f0f4ff;
      color: #667eea;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      color: #555;
      font-size: 14px;
    }

    .contact-item .label {
      color: #999;
      min-width: 50px;
    }

    .footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #f0f0f0;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">T</div>

    <h1>Test User</h1>
    <p class="title">全栈开发者</p>

    <div class="section">
      <h2>技能</h2>
      <div class="skills">
        <span class="skill-tag">Python</span>
        <span class="skill-tag">TypeScript</span>
        <span class="skill-tag">React</span>
        <span class="skill-tag">Node.js</span>
        <span class="skill-tag">Docker</span>
        <span class="skill-tag">PostgreSQL</span>
      </div>
    </div>

    <div class="section">
      <h2>联系方式</h2>
      <div class="contact-item">
        <span class="label">邮箱</span>
        <span>testuser@example.com</span>
      </div>
      <div class="contact-item">
        <span class="label">GitHub</span>
        <span>github.com/testuser</span>
      </div>
      <div class="contact-item">
        <span class="label">微信</span>
        <span>test_user</span>
      </div>
    </div>

    <div class="footer">
      &copy; 2025 Test User. All Rights Reserved.
    </div>
  </div>
</body>
</html>
