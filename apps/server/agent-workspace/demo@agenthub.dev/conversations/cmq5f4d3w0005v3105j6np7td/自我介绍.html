<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人介绍</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
      color: white;
      font-weight: bold;
    }

    h1 {
      font-size: 28px;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .title {
      font-size: 16px;
      color: #666;
      margin-bottom: 32px;
    }

    .section {
      text-align: left;
      margin-bottom: 28px;
    }

    .section h2 {
      font-size: 14px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-tag {
      background: #f0f0f5;
      color: #333;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      color: #444;
      font-size: 15px;
    }

    .contact-item .icon {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .bio {
      font-size: 15px;
      line-height: 1.8;
      color: #555;
      text-align: left;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">张</div>
    <h1>张三</h1>
    <p class="title">全栈开发工程师</p>

    <p class="bio">
      热爱编程与技术分享，拥有 5 年 Web 开发经验。专注于构建高效、可维护的应用系统，
      崇尚简洁清晰的代码风格。
    </p>

    <div class="section">
      <h2>技能</h2>
      <div class="skills">
        <span class="skill-tag">JavaScript / TypeScript</span>
        <span class="skill-tag">React</span>
        <span class="skill-tag">Vue.js</span>
        <span class="skill-tag">Node.js</span>
        <span class="skill-tag">Python</span>
        <span class="skill-tag">PostgreSQL</span>
        <span class="skill-tag">Docker</span>
        <span class="skill-tag">Git</span>
      </div>
    </div>

    <div class="section">
      <h2>联系方式</h2>
      <div class="contact-item">
        <span class="icon">📧</span>
        <span>zhangsan@example.com</span>
      </div>
      <div class="contact-item">
        <span class="icon">🌐</span>
        <span>github.com/zhangsan</span>
      </div>
      <div class="contact-item">
        <span class="icon">📱</span>
        <span>+86 138-0000-0000</span>
      </div>
    </div>
  </div>
</body>
</html>
